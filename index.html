<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wikibox Editor</title>
<meta name="description" content="Энциклопедия альтернативной истории и редактор статей в стиле Википедии">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='white' stroke='%23202122' stroke-width='2'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Georgia,serif' font-size='19' fill='%23202122'%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css?v=58">
<script>try{var a=JSON.parse(localStorage.getItem('apokrif-appearance')||'{}'),d=document.documentElement;d.dataset.size=a.size||'1';d.dataset.width=a.width||'std';if(a.theme&&a.theme!=='auto')d.dataset.theme=a.theme;}catch(e){}</script>
</head>
<body>
<header class="vh-wrap">
  <div class="vh">
    <button class="vh-burger" id="burger" data-act="burger" aria-label="Главное меню" aria-expanded="false">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M1 3h18v2H1zm0 6h18v2H1zm0 6h18v2H1z" fill="currentColor"/></svg>
    </button>
    <a class="logo" href="#/">
      <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 50 50" width="50" height="50"><circle cx="25" cy="25" r="22" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="25" cy="25" r="17.5" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="2 2.2"/><text x="25" y="33" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="currentColor">W</text></svg></span>
      <span class="logo-text"><b id="logo-name">Wikibox Editor</b><small id="logo-motto" hidden></small></span>
    </a>
    <form class="search" id="search" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Искать в Wikibox Editor" aria-label="Поиск">
      <button class="btn">Найти</button>
      <ul id="sugg" class="sugg" hidden></ul>
    </form>
    <nav class="vh-links" aria-label="Служебные ссылки">
      <a href="#/new">Создать статью</a><a href="#/import">Импорт из Википедии</a><a href="#/media">Медиатека</a><a href="#/file">Файл проекта</a>
    </nav>
  </div>
  <div id="menu" class="menu" hidden></div>
</header>
<div class="vpage">
  <nav class="vside" id="side" aria-label="Навигация"></nav>
  <main class="vmain" id="main"></main>
  <aside class="vtools" id="tools" aria-label="Внешний вид"></aside>
</div>
<div id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="vendor/d3.min.js"></script>
<script src="vendor/d3-geo-projection.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/topojson-server.min.js"></script>
<script src="vendor/polygon-clipping.min.js"></script>
<script src="js/render.js?v=58"></script>
<script src="js/data.js?v=58"></script>
<script src="js/mapdraw.js?v=58"></script>
<script src="js/maps.js?v=58"></script>
<script src="js/worldimg.js?v=58"></script>
<script src="js/worlds.js?v=58"></script>
<script src="js/import.js?v=58"></script>
<script src="js/app.js?v=58"></script>
<script src="js/richedit.js?v=58"></script>
<script src="js/tableedit.js?v=58"></script>
</body>
</html>
